*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

body {
  margin: 0;
  background: #fff;
  color: #000;
  font-family: Andika, "Trebuchet MS", "Lucida Grande", Verdana, sans-serif;
  font-size: 19px;
  line-height: 1.45;
}

button {
  font: inherit; color: inherit;
  -ms-touch-action: manipulation; touch-action: manipulation;
  -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
  -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
}
img { max-width: 100%; -webkit-touch-callout: none; }

.sr-only {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
  overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
}

.page { max-width: 1040px; margin: 0 auto; padding: 20px 28px 64px; }

.masthead { margin-bottom: 20px; }

.subhead { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; }
.byline { -webkit-flex: 1 1 auto; flex: 1 1 auto; min-width: 0; margin: 0; font-weight: 700; font-size: 21px; line-height: 1.3; }

/* Buttons are never used as flex containers: old Safari (iOS 10 and earlier) cannot do that. */
.sound-toggle {

.rule svg { display: block; width: 100%; overflow: hidden; }
.rule .rule-lg { height: 40px; }

/* ------------------------------------------------------------------- stage */

.stage { display: -webkit-flex; display: flex; -webkit-align-items: flex-start; align-items: flex-start; }
.main-col { -webkit-flex: 1 1 auto; flex: 1 1 auto; min-width: 0; }
.side-col {

}

/* The question sits on a sheet with a second sheet peeking out behind it,

.card {

  margin: 0 0 10px 10px;
  padding: 20px 28px 26px;

}

.option.is-dim { opacity: .4; }

.option.is-correct { background: #1a7f37; color: #fff; }

.option.is-correct .bubble::after {
  content: ""; position: absolute; left: 7.5px; top: 2.5px; width: 8px; height: 14px;
  border: solid #1a7f37; border-width: 0 3.5px 3.5px 0;

}

.option.is-wrong { background: #e6e6e6; }
.option.is-wrong .bubble { background: #000; }
.option.is-wrong .bubble::before,
.option.is-wrong .bubble::after {
  content: ""; position: absolute; left: 3px; right: 3px; top: 50%;
  height: 3.5px; margin-top: -1.75px; border-radius: 2px; background: #fff;
}
.option.is-wrong .bubble::before { -webkit-transform: rotate(45deg); transform: rotate(45deg); }
.option.is-wrong .bubble::after { -webkit-transform: rotate(-45deg); transform: rotate(-45deg); }

.options--pictures { display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap; flex-wrap: wrap; margin: 0 -5px; }

.option-pic { display: block; -webkit-flex: 1 1 0%; flex: 1 1 0%; min-width: 0; }
.option-pic img { display: block; width: 100%; height: auto; border-radius: 8px; }

.feedback { margin: 16px 0 0; padding: 0 0 0 16px; border-left: 7px solid #000; }

.actions { margin: 16px 0 0; }
.next {

/* Hover effects only where there is a mouse. On a touch screen a "hover" sticks to whatever is

@media (hover: hover) and (pointer: fine) {

button:focus-visible { outline: 3px solid #1976d2; outline-offset: 3px; }

.meter-box { position: relative; height: 440px; padding-left: 40px; }

  background: -webkit-linear-gradient(bottom, #e5252a 0%, #f58a1f 17%, #ffd400 34%, #23a455 50%, #1976d2 67%, #4338a8 84%, #8e44c2 100%);
  background: linear-gradient(to top, #e5252a 0%, #f58a1f 17%, #ffd400 34%, #23a455 50%, #1976d2 67%, #4338a8 84%, #8e44c2 100%);
  box-shadow: 5px 5px 0 #000;

.meter-tip {

  100% { opacity: 0; box-shadow: 0 0 0 0 #fff; }
}
@keyframes spark {

@-webkit-keyframes lamptest { 0% { height: 100%; } 45% { height: 0; } 60% { height: 0; } 100% { height: 100%; } }

.meter-scale { position: absolute; left: 0; top: 3px; bottom: 3px; width: 32px; margin: 0; padding: 0; list-style: none; }

<script>window.LSQ_DATA = {"questions":[{"id":"L01","topic":"light","q":"What is light?","options":["A form of energy that lets us see","A form of energy we can only hear","A kind of material, like wood","A type of liquid"],"answer":0,"why":"Light is a form of energy that allows us to see."},{"id":"L02","topic":"light","q":"How does light travel until it hits something?","options":["In a straight path","In a zigzag path","In a circle","In a spiral"],"answer":0,"why":"Light travels in a straight path until it interacts with something."},{"id":"L03","topic":"light","q":"About how fast does light travel?","options":["300 000 km per second","300 km per second","300 000 km per hour","30 km per hour"],"answer":0,"why":"Light is incredibly fast. It travels about 300 000 km every second!"},{"id":"L04","topic":"light","q":"Something that produces its own light is called a…","options":["light source","reflector","shadow","prism"],"answer":0,"why":"A light source is something that produces its own light, like the Sun or a light bulb."},{"id":"L05","topic":"light","q":"Which word means “to produce or give off light”?","options":["Emit","Reflect","Absorb","Refract"],"answer":0,"why":"Emit means to produce or give off light. The Sun emits light."},{"id":"L06","topic":"light","q":"Which of these emits its own light?","options":["The Sun","The Moon","A mirror","A white wall"],"answer":0,"why":"The Sun emits light. The Moon, a mirror and a white wall only reflect light."},{"id":"L07","topic":"light","q":"Why does the Moon look bright at night?","options":["It reflects light from the Sun","It makes its own light","It absorbs all the light that hits it","It bends light from the stars"],"answer":0,"why":"The Moon does NOT produce its own light. It reflects light from the Sun."},{"id":"L08","topic":"light","q":"What is artificial light?","options":["Light from things made by humans","Light produced by things in nature","Light that bounces off the Moon","Light that has been absorbed"],"answer":0,"why":"Artificial light is man-made light. It is usually powered by electricity or gas."},{"id":"L09","topic":"light","q":"Two of these four light sources are natural. Which two?","options":["Stars and the Sun","Traffic lights and light bulbs","Stars and traffic lights","Light bulbs and the Sun"],"answer":0,"why":"Stars and the Sun are found in nature. Traffic lights and light bulbs are made by humans.","img":"light-sources","alt":"Four picture cards: stars, traffic lights, light bulbs and the Sun."},{"id":"L10","topic":"light","q":"Which insect is a natural light source because it makes its own light?","options":["A firefly","A butterfly","A ladybug","A bee"],"answer":0,"why":"Fireflies glow all by themselves, so they are a natural light source."},{"id":"L11","topic":"light","q":"On the Light Anchor Chart, which of these is a natural light source?","options":["A jellyfish","A glow stick","A smartphone","A light bulb"],"answer":0,"why":"The chart shows the Sun, a jellyfish and fire as natural light sources. Glow sticks, smartphones and light bulbs are artificial."},{"id":"L12","topic":"light","q":"Which of these is an artificial light source?","options":["A neon light","Lightning","Lava","Sunlight"],"answer":0,"why":"Humans make neon lights, so they are artificial. Lightning, lava and sunlight come from nature."},{"id":"L13","topic":"light","q":"What kind of light source is this street lamp?","options":["Artificial, because humans made it","Natural, because it is found in nature","Natural, because it is outdoors","It is not a light source at all"],"answer":0,"why":"A street lamp is made by humans, so its light is artificial.","img":"street-lamp","alt":"A glowing street lamp among snowy branches."},{"id":"L14","topic":"light","q":"Which of these is NOT a light source?","options":["A mirror","The Sun","A flashlight","A firefly"],"answer":0,"why":"A mirror does not make its own light. It only reflects light that hits it."},{"id":"L15","topic":"light","q":"What does “reflect” mean?","options":["Light bounces off a surface","Light bends as it passes through something","Light is taken in and stops","Light is made by an object"],"answer":0,"why":"Reflect means light bounces off a surface."},{"id":"L16","topic":"light","q":"What is it called when light bends as it passes from one material into another?","options":["Refraction","Reflection","Absorption","Vibration"],"answer":0,"why":"Refraction is when light bends as it passes from one material into another, like from air into water."},{"id":"L17","topic":"light","q":"What is it called when light is taken in by a material and does not bounce back?","options":["Absorption","Reflection","Refraction","Amplitude"],"answer":0,"why":"Absorption is when a material takes in light. The light stops there."},{"id":"L18","topic":"light","q":"When light hits an object, it can do three things. What are they?","options":["Be absorbed, reflected or refracted","Be loud, quiet or silent","Be solid, liquid or gas","Be natural, artificial or electric"],"answer":0,"why":"Light can be absorbed (stopped), reflected (bounced off) or refracted (bent)."},{"id":"L19","topic":"light","q":"Look at the arrow. What is the dark block doing to the light?","options":["Absorbing it (the light stops there)","Reflecting it (the light bounces off)","Refracting it (the light bends as it passes through)","Emitting it (the block makes its own light)"],"answer":0,"why":"The arrow stops at the block. The light does not bounce off or pass through, so it is absorbed.","img":"prop-absorb","alt":"A sun shines down on a dark block. An arrow goes from the sun to the block and stops there."},{"id":"L20","topic":"light","q":"Look at the arrows. What is the grey block doing to the light?","options":["Reflecting it (the light bounces off)","Absorbing it (the light stops there)","Refracting it (the light bends as it passes through)","Emitting it (the block makes its own light)"],"answer":0,"why":"The second arrow shows the light bouncing off the surface. That is reflection.","img":"prop-reflect","alt":"A sun shines down on a grey block. One arrow goes down to the block. A second arrow leaves the top of the block, pointing up and away."},{"id":"L21","topic":"light","q":"Look at the arrows. What is this block doing to the light?","options":["Refracting it (the light bends as it passes through)","Absorbing it (the light stops there)","Reflecting it (the light bounces off)","Emitting it (the block makes its own light)"],"answer":0,"why":"The light passes through the block and comes out in a new direction. It has bent, so this is refraction.","img":"prop-refract","alt":"A sun shines down on a pale block. One arrow goes down to the block. A second arrow comes out underneath, pointing in a new direction."},{"id":"L22","topic":"light","q":"Why can you see your reflection in a mirror?","options":["The mirror bounces light back to your eyes","The mirror makes its own light","The mirror soaks up all the light","The mirror bends light around you"],"answer":0,"why":"A mirror reflects light very well. The light bounces back to your eyes, so you see yourself."},{"id":"L23","topic":"light","q":"The flashlight beam hits the mirror and bounces off. What is this called?","options":["Reflection","Refraction","Absorption","An echo"],"answer":0,"why":"When light bounces off a surface, it is called reflection.","img":"mirror-beam","alt":"A flashlight beam hits a mirror and bounces away in a new direction."},{"id":"L24","topic":"light","q":"A black shirt and a white shirt are left in the sun. Why does the black shirt get warmer?","options":["It absorbs more light energy","It reflects more light energy","It refracts more light","It makes its own light"],"answer":0,"why":"A black shirt absorbs more light energy, so it can become warmer."},{"id":"L25","topic":"light","q":"On a sunny day, which colour of T-shirt reflects the most light?","options":["White","Black","Dark blue","Dark grey"],"answer":0,"why":"White reflects most of the light that hits it. Dark colours absorb more light and get warmer."},{"id":"L26","topic":"light","q":"An object looks black when it…","options":["absorbs all the colours of white light","reflects all the colours of white light","refracts all the colours of white light","makes all the colours of light"],"answer":0,"why":"An object is seen as black if it absorbs all the colours of white light."},{"id":"L27","topic":"light","q":"Which two things refract (bend) light?","options":["Diamonds and water","Wood and cardboard","Mirrors and metal","Black shirts and white walls"],"answer":0,"why":"Light passes through diamonds and water and bends. That is refraction."},{"id":"L28","topic":"light","q":"The pencil looks bent, but it is not really bent. What is this bending of light called?","options":["Refraction","Reflection","Absorption","Vibration"],"answer":0,"why":"Light bends as it changes from air to water. That bending is called refraction.","img":"pencil","alt":"A pencil standing in a glass of water. The pencil looks bent where it enters the water. Labels say the pencil is not really bent, and that light bends as it changes from air to water."},{"id":"L29","topic":"light","q":"A pencil standing in a glass of water looks broken. Is the pencil really broken?","options":["No, the light bends, not the pencil","Yes, the water snaps the pencil","Yes, the glass squeezes the pencil","No, the pencil is making its own light"],"answer":0,"why":"The pencil is fine! Light bends as it goes from air into water, so the pencil only looks bent or broken."},{"id":"L30","topic":"light","q":"Light travels along paths called light…","options":["waves","sources","bulbs","switches"],"answer":0,"why":"Light travels in straight paths called light waves."},{"id":"L31","topic":"light","q":"In the Maze Mission, mirrors guide a flashlight beam through a maze. Which property of light makes this work?","options":["Reflection","Refraction","Absorption","Vibration"],"answer":0,"why":"The light bounces off each mirror and changes direction. That is reflection."},{"id":"L32","topic":"light","q":"In the Maze Mission, the flashlight has to stay still. How can you steer the light so it reaches the end of the maze?","options":["Change the angle of the mirrors","Cover the mirrors with cardboard","Turn the flashlight off","Make the room darker"],"answer":0,"why":"Turning a mirror changes the direction the light bounces, so you can steer the beam through the maze."},{"id":"L33","topic":"light","q":"The flashlight shines on the book. How does the light get from the book to the eye?","options":["It reflects (bounces) off the book","It is absorbed by the book","The book makes its own light","It bends through the book"],"answer":0,"why":"Light reflects off objects, just like a ball bounces off the ground. The reflected light reaches your eyes.","img":"book-eye","alt":"A flashlight shines on a book. Arrows go from the flashlight to the book, and then from the book to an eye."},{"id":"L34","topic":"light","q":"A material that lets light pass through easily is…","options":["transparent","translucent","opaque","reflective"],"answer":0,"why":"Transparent materials, like clear glass, let light pass through easily."},{"id":"L35","topic":"light","q":"A material that lets only some light through, so things look blurry, is…","options":["translucent","transparent","opaque","invisible"],"answer":0,"why":"Translucent materials let some light pass through, but you cannot see objects clearly."},{"id":"L36","topic":"light","q":"A material that light cannot pass through is…","options":["opaque","transparent","translucent","clear"],"answer":0,"why":"Opaque materials, like wood and metal, do not let light pass through."},{"id":"L37","topic":"light","q":"Which of these is transparent?","options":["Clear glass","Wood","Cardboard","Metal"],"answer":0,"why":"Light passes easily through clear glass. Wood, cardboard and metal are opaque."},{"id":"L38","topic":"light","q":"Which of these is opaque?","options":["Cardboard","Clear plastic","Clean water","Frosted glass"],"answer":0,"why":"Light cannot pass through cardboard, so it is opaque."},{"id":"L39","topic":"light","q":"Which of these is translucent?","options":["Wax paper","Metal","Clear glass","Wood"],"answer":0,"why":"Wax paper lets some light through, so it is translucent."},{"id":"L40","topic":"light","q":"Tissue paper lets some light through, but not all of it. That makes tissue paper…","options":["translucent","transparent","opaque","a light source"],"answer":0,"why":"Opaque means no light gets through. Tissue paper lets some light through, so it is translucent."},{"id":"L41","topic":"light","q":"A teacher holds a mystery sheet in front of a lamp. She can see objects clearly through it. The sheet is…","options":["transparent","translucent","opaque","a mirror"],"answer":0,"why":"If you can see clearly through it, light is passing through easily. That is transparent."},{"id":"L42","topic":"light","q":"A teacher holds a mystery sheet in front of a lamp. No light passes through it at all. The sheet is…","options":["opaque","transparent","translucent","a light source"],"answer":0,"why":"If no light passes through, the material is opaque."},{"id":"L43","topic":"light","q":"A teacher holds a mystery sheet in front of a lamp. Light passes through, but objects look blurry. The sheet is…","options":["translucent","transparent","opaque","a mirror"],"answer":0,"why":"Some light gets through but things look blurry, so the sheet is translucent."},{"id":"L44","topic":"light","q":"Which of these materials lets the most light pass through?","options":["Clear plastic","Cardboard","Tissue paper","Wood"],"answer":0,"why":"Clear plastic is transparent, so most light passes through it."},{"id":"L45","topic":"light","q":"Why can’t you see through a wooden door?","options":["Wood is opaque, so light cannot pass through it","Wood is transparent, so light passes through easily","Wood is translucent, so some light passes through","Wood is a light source"],"answer":0,"why":"Wood is opaque. Light cannot pass through it, so you cannot see what is on the other side."},{"id":"L46","topic":"light","q":"What does a prism do to white light?","options":["Splits it into the colours of the rainbow","Turns all of it into sound waves","Soaks up all of the light","Makes the light travel in circles"],"answer":0,"why":"A prism separates white light into a rainbow of different colours."},{"id":"L47","topic":"light","q":"A prism makes a rainbow by bending light. What is this bending called?","options":["Refraction","Reflection","Absorption","An echo"],"answer":0,"why":"A prism refracts (bends) light. Each colour bends a different amount, so the colours spread out."},{"id":"L48","topic":"light","q":"A prism splits sunlight into a rainbow. Starting with red, what is the order of the colours? (Violet is a kind of purple.)","options":["Red, orange, yellow, green, blue, indigo, violet","Red, yellow, orange, blue, green, violet, indigo","Red, green, orange, blue, yellow, indigo, violet","Red, orange, green, yellow, blue, violet, indigo"],"answer":0,"why":"The colours always come in the same order: red, orange, yellow, green, blue, indigo, violet."},{"id":"L49","topic":"light","q":"In the Magical Coin station, a coin under a clear container seems to disappear when water is poured in. What causes this?","options":["The water refracts (bends) the light from the coin","The water absorbs (soaks up) all the light","The coin dissolves in the water","The coin starts making its own light"],"answer":0,"why":"Refraction! The light from the coin bends, so it no longer reaches your eyes through the side of the container."},{"id":"L50","topic":"light","q":"At the fibre optics station, you shine a light into one end of a bent cable. Where does the light come out?","options":["At the other end of the cable","Nowhere, because it stops at the first bend","Back out of the same end it went in","Nowhere, because the cable soaks it all up"],"answer":0,"why":"The light bounces along the inside of the cable, so it follows every bend and shines out of the other end."},{"id":"S01","topic":"sound","q":"What is sound?","options":["A form of energy made by vibrations","A form of energy our eyes detect","A kind of material, like metal","A colour of the rainbow"],"answer":0,"why":"Sound is a form of energy. It is created by vibrations."},{"id":"S02","topic":"sound","q":"We can hear someone speaking because sound travels through the air. What is air?","options":["A gas","A liquid","A solid","A light source"],"answer":0,"why":"Air is a gas. Sound travels through gases, but more slowly than it travels through solids."},{"id":"S03","topic":"sound","q":"What does “vibrate” mean?","options":["To shake back and forth very quickly","To glow brightly","To bend when entering water","To stay perfectly still"],"answer":0,"why":"When something vibrates, it shakes back and forth very quickly."},{"id":"S04","topic":"sound","q":"When you hit a drum, what happens first?","options":["The drum skin vibrates","Your ears detect the sound","The sound travels through the air","The air around the drum vibrates"],"answer":0,"why":"First the drum skin vibrates. Then the air vibrates, the sound travels, and your ears detect it.","img":"drum","alt":"A drumstick hits a drum. Curved blue lines spread out from the drum towards an ear. One label says sound waves travel through the air. Another says the sound waves reach your ears and your brain interprets them as sound."},{"id":"S05","topic":"sound","q":"You hit a drum. Which order is correct?","options":["Drum vibrates → air vibrates → sound travels → ears detect the sound","Ears detect the sound → drum vibrates → air vibrates → sound travels","Air vibrates → drum vibrates → ears detect the sound → sound travels","Sound travels → ears detect the sound → air vibrates → drum vibrates"],"answer":0,"why":"The drum vibrates, which makes the air vibrate. The sound travels through the air until your ears detect it."},{"id":"S06","topic":"sound","q":"A drum vibrates, and the air particles next to it move back and forth. What do those particles do next?","options":["Pass the energy on to nearby particles","Turn into tiny sparks of light","Stop moving and stay still","Fall straight down to the floor"],"answer":0,"why":"The moving particles pass the energy to nearby particles. That creates a sound wave."},{"id":"S07","topic":"sound","q":"Sound waves can travel through…","options":["air, water and solid objects","air, but not water or solids","water, but not air or solids","solid objects, but not air or water"],"answer":0,"why":"Sound waves can travel through air, water, and even solid objects."},{"id":"S08","topic":"sound","q":"Sound travels through a medium. What is a medium?","options":["A material, such as a gas, a liquid or a solid","A sound that is not too loud or too quiet","A sound with a very high pitch","A place where there is no sound at all"],"answer":0,"why":"A medium is the material that sound travels through. It can be a gas, a liquid or a solid."},{"id":"S09","topic":"sound","q":"Through which of these does sound travel fastest?","options":["A solid, like a wooden door","A gas, like air","A liquid, like water","It is the same speed in all three"],"answer":0,"why":"Sound travels quickly through solids. It is slower in liquids and gases."},{"id":"S10","topic":"sound","q":"Why does sound travel quickly through solids?","options":["The particles are close together","The particles are far apart","Solids are always warm","Solids are transparent"],"answer":0,"why":"In a solid the particles are close together, so they pass the vibration along quickly."},{"id":"S11","topic":"sound","q":"Whales use sound to communicate underwater. What does this show?","options":["Sound can travel through liquids","Sound cannot travel through water","Sound only travels through air","Sound is a kind of light"],"answer":0,"why":"Water is a liquid. Whales and dolphins can hear each other because sound travels through liquids.","img":"whale","alt":"A whale swimming underwater."},{"id":"S12","topic":"sound","q":"You can hear a knock by putting your ear against a door. What does this show?","options":["Sound can travel through solids","Sound cannot travel through wood","Sound only travels through liquids","Doors absorb all sound"],"answer":0,"why":"A door is a solid. The sound of the knock travels through it to your ear.","img":"door","alt":"A girl leans in close to a wooden door, with one hand on it, to listen."},{"id":"S13","topic":"sound","q":"When sound waves reach your ears, what do they make vibrate?","options":["Your eardrums","Your vocal cords","Your eyelids","Your teeth"],"answer":0,"why":"Sound waves make your eardrums vibrate. When your eardrums vibrate, you hear the sound!"},{"id":"S14","topic":"sound","q":"When you talk, which part of your body creates the sound vibrations?","options":["Your vocal cords","Your eardrums","Your eyes","Your knees"],"answer":0,"why":"Your vocal cords create sound vibrations as air passes through them."},{"id":"S15","topic":"sound","q":"A guitar string is plucked. What makes the sound?","options":["The string vibrates and creates sound waves","The string reflects light","The string absorbs the air","The string stays perfectly still"],"answer":0,"why":"The plucked string vibrates. The vibrations create sound waves that travel to your ears."},{"id":"S16","topic":"sound","q":"Sound waves enter your ear. Which part of your body interprets them as sound?","options":["Your brain","Your heart","Your lungs","Your stomach"],"answer":0,"why":"The sound waves reach your ears, and your brain interprets them as sound."},{"id":"S17","topic":"sound","q":"What does pitch tell us about a sound?","options":["Whether it is high or low","Whether it is loud or quiet","Whether it is near or far","Whether it is natural or artificial"],"answer":0,"why":"Pitch tells us whether a sound is high or low."},{"id":"S18","topic":"sound","q":"What does loudness tell us about a sound?","options":["How strong or quiet it is","How high or low it is","What colour it is","What made it"],"answer":0,"why":"Loudness tells us how strong or quiet a sound is."},{"id":"S19","topic":"sound","q":"What is frequency?","options":["The number of vibrations made per second","The distance from the top of a wave to the bottom","How loud or quiet a sound seems to us","How far a sound can travel through the air"],"answer":0,"why":"Frequency is the number of vibrations made per second."},{"id":"S20","topic":"sound","q":"A sound with a high frequency has a…","options":["high pitch","low pitch","high volume","low volume"],"answer":0,"why":"High frequency means lots of vibrations per second, which makes a high-pitched sound."},{"id":"S21","topic":"sound","q":"Which of these is a high-pitched sound?","options":["A whistle","Thunder","A bass guitar","A deep voice"],"answer":0,"why":"Whistles, crickets and squeals are high-pitched. Thunder, a bass guitar and a deep voice are low-pitched."},{"id":"S22","topic":"sound","q":"Which of these is a low-pitched sound?","options":["Thunder","A cricket chirping","A whistle","A squeal"],"answer":0,"why":"Thunder is a low-pitched sound. Crickets, whistles and squeals are high-pitched."},{"id":"S23","topic":"sound","q":"What is amplitude?","options":["The size or strength of the vibration in a sound wave","The number of vibrations made per second","Whether a sound is high-pitched or low-pitched","The material that a sound travels through"],"answer":0,"why":"Amplitude is the size or strength of the vibration in a sound wave."},{"id":"S24","topic":"sound","q":"A sound wave with greater amplitude makes a…","options":["louder sound","quieter sound","higher-pitched sound","lower-pitched sound"],"answer":0,"why":"Greater amplitude means a louder sound. Smaller amplitude means a quieter sound."},{"id":"S25","topic":"sound","q":"What is the top of a sound wave called?","options":["The peak","The trough","The pitch","The echo"],"answer":0,"why":"The top of a wave is the peak. The bottom is the trough."},{"id":"S26","topic":"sound","q":"What is the bottom of a sound wave called?","options":["The trough","The peak","The frequency","The medium"],"answer":0,"why":"The bottom of a wave is the trough. The top is the peak."},{"id":"S27","topic":"sound","q":"Which of these sounds has a high amplitude?","options":["Fireworks","A whisper","A mouse squeaking softly","A cat purring quietly"],"answer":0,"why":"Loud sounds, like fireworks, have a high amplitude."},{"id":"S28","topic":"sound","q":"Which of these sounds has a low amplitude?","options":["A whisper","A lawnmower","A loud concert","Construction work"],"answer":0,"why":"Quiet sounds, like a whisper, have a low amplitude."},{"id":"S29","topic":"sound","q":"The waves in A are not as tall as the waves in B. What does that tell you?","options":["A is quieter than B","A is louder than B","A has a higher pitch than B","A has a lower pitch than B"],"answer":0,"why":"Waves that are not as tall have a smaller amplitude, and a smaller amplitude means a quieter sound.","img":"pair-loudness","alt":"Two sound waves, A and B. The waves in A are small. The waves in B are about twice as tall. Both have three waves."},{"id":"S30","topic":"sound","q":"Which sound wave is more likely to be from a loud concert, and why?","options":["B, because taller waves mean a louder sound","A, because smaller waves mean a louder sound","B, because taller waves mean a higher pitch","A, because smaller waves mean a higher pitch"],"answer":0,"why":"B has taller waves. Taller waves mean a greater amplitude, which makes a louder sound.","img":"pair-loudness","alt":"Two sound waves, A and B. The waves in A are small. The waves in B are about twice as tall. Both have three waves."},{"id":"S31","topic":"sound","q":"Which sound wave is more likely to be from a low bass drum, and why?","options":["A, because spread-out waves mean a low pitch","B, because squeezed-together waves mean a low pitch","A, because spread-out waves mean a loud sound","B, because squeezed-together waves mean a quiet sound"],"answer":0,"why":"A’s waves are spread out. That means a low frequency, and a low frequency makes a low pitch, like a bass drum.","img":"pair-pitch","alt":"Two sound waves, A and B, of about the same height. A has two wide waves, spread far apart. B has five narrow waves, squeezed close together."},{"id":"S32","topic":"sound","q":"Wave B has more waves squeezed into the same space than wave A. What does that tell you?","options":["B has a higher pitch than A","B has a lower pitch than A","B is quieter than A","B is louder than A"],"answer":0,"why":"More waves squeezed together means a higher frequency. A higher frequency means a higher pitch.","img":"pair-pitch","alt":"Two sound waves, A and B, of about the same height. A has two wide waves, spread far apart. B has five narrow waves, squeezed close together."},{"id":"S33","topic":"sound","q":"Which wave shows a LOUD sound with a LOW pitch?","options":[{"img":"wave-loud-low","alt":"Tall waves, spread far apart"},{"img":"wave-quiet-high","alt":"Short waves, squeezed close together"},{"img":"wave-quiet-low","alt":"Short waves, spread far apart"},{"img":"wave-loud-high","alt":"Tall waves, squeezed close together"}],"answer":0,"why":"Tall waves mean a loud sound. Waves that are spread out mean a low pitch."},{"id":"S34","topic":"sound","q":"Which wave could be a mouse squeaking softly?","options":[{"img":"wave-quiet-high","alt":"Short waves, squeezed close together"},{"img":"wave-loud-low","alt":"Tall waves, spread far apart"},{"img":"wave-quiet-low","alt":"Short waves, spread far apart"},{"img":"wave-loud-high","alt":"Tall waves, squeezed close together"}],"answer":0,"why":"A squeak is high-pitched, so the waves are squeezed together. It is soft, so the waves are small."},{"id":"S35","topic":"sound","q":"Which wave could be a big dog growling softly?","options":[{"img":"wave-quiet-low","alt":"Short waves, spread far apart"},{"img":"wave-loud-low","alt":"Tall waves, spread far apart"},{"img":"wave-quiet-high","alt":"Short waves, squeezed close together"},{"img":"wave-loud-high","alt":"Tall waves, squeezed close together"}],"answer":0,"why":"A growl is low-pitched, so the waves are spread out. It is soft, so the waves are small."},{"id":"S36","topic":"sound","q":"Which wave could be a loud, high whistle?","options":[{"img":"wave-loud-high","alt":"Tall waves, squeezed close together"},{"img":"wave-loud-low","alt":"Tall waves, spread far apart"},{"img":"wave-quiet-high","alt":"Short waves, squeezed close together"},{"img":"wave-quiet-low","alt":"Short waves, spread far apart"}],"answer":0,"why":"A whistle is high-pitched, so the waves are squeezed together. It is loud, so the waves are tall."},{"id":"S37","topic":"sound","q":"Sound waves hit a hard surface, like a stone wall. What can happen?","options":["Some of the sound bounces back","All of the sound is soaked up","The sound turns into light","The sound gets a higher pitch"],"answer":0,"why":"When sound waves hit a hard surface, some of the sound can bounce back. Sound reflects, just like light!"},{"id":"S38","topic":"sound","q":"A speaker is turned up so the sound becomes stronger. What has changed?","options":["Its loudness","Its pitch","Its frequency","The medium it travels through"],"answer":0,"why":"Turning a speaker up gives the sound waves a greater amplitude. That changes the loudness, not the pitch."},{"id":"S39","topic":"sound","q":"What is an echo?","options":["Sound that has bounced back off a surface","Sound that has been absorbed by a soft material","A very high-pitched sound, like a whistle","Light that has bounced off a mirror"],"answer":0,"why":"Echoes are caused by sound reflection. The sound bounces back off a hard surface."},{"id":"S40","topic":"sound","q":"Which of these is a good sound absorber?","options":["Carpet","Concrete","Brick","Glass"],"answer":0,"why":"Soft materials like carpet, wool, curtains and foam are very good at absorbing sound."},{"id":"S41","topic":"sound","q":"Which of these is a good sound reflector?","options":["Brick","Wool","Foam","Curtains"],"answer":0,"why":"Hard objects like brick, concrete, granite and glass are good sound reflectors."},{"id":"S42","topic":"sound","q":"Which group are all good sound absorbers?","options":["Wool, cotton, blankets and foam","Tile, brick, stone and marble","Metal, ceramic and glass","Wool, brick, foam and metal"],"answer":0,"why":"Soft materials absorb sound. Wool, cotton, blankets and foam are all soft."},{"id":"S43","topic":"sound","q":"What can these soft materials do to sound?","options":["Absorb some of it","Reflect all of it","Make it louder","Raise its pitch"],"answer":0,"why":"Soft materials such as carpets, curtains, cushions and upholstered seats can absorb some sound.","img":"soft-materials","alt":"Four pictures of soft materials: carpets, curtains, cushions and upholstered seats."},{"id":"S44","topic":"sound","q":"Why do theatres often have carpets and soft, padded seats?","options":["Soft materials absorb sound and cut down echoes","Soft materials reflect sound and make more echoes","Soft materials make their own light","Soft materials raise the pitch of voices"],"answer":0,"why":"Soft materials absorb sound, so there are fewer echoes bouncing around the theatre."},{"id":"S45","topic":"sound","q":"A new music room has bare walls and a hard floor, so sounds bounce around. What would help most?","options":["Adding carpet and curtains","Adding hard tiles to the walls","Painting the walls white","Taking out the soft chairs"],"answer":0,"why":"Carpet and curtains are soft. They absorb sound, so less of it bounces around the room."},{"id":"S46","topic":"sound","q":"A ringing phone is in a box. You pack soft fabric around it and the ring sounds quieter. Why?","options":["The fabric absorbs some of the sound waves","The fabric reflects the sound out of the box","The fabric raises the pitch of the ring","The fabric turns the sound into light"],"answer":0,"why":"Soft fabric absorbs some of the energy of the sound waves, so less sound gets out."},{"id":"S47","topic":"sound","q":"Sound can be “modified”. What does that mean?","options":["It can be changed","It can be seen","It can never change","It turns into light"],"answer":0,"why":"Modified means changed. Sound can change in pitch (high or low) and loudness (strong or quiet)."},{"id":"S48","topic":"sound","q":"You hear a bird chirp. It sounds very high, but it is quiet. How would you describe it?","options":["High pitch, low volume","Low pitch, high volume","High pitch, high volume","Low pitch, low volume"],"answer":0,"why":"High means a high pitch. Quiet means a low volume."},{"id":"S49","topic":"sound","q":"Which of these would make a drum sound quieter?","options":["Hitting it more gently","Hitting it harder","Moving your ear closer to it","Playing it in a room with bare, hard walls"],"answer":0,"why":"A gentle hit makes smaller vibrations. A smaller amplitude means a quieter sound."},{"id":"S50","topic":"sound","q":"Where would you most likely hear an echo?","options":["In an empty room with hard, bare walls","In a room with thick carpet and curtains","Under a pile of pillows","In a closet full of clothes"],"answer":0,"why":"Hard, bare walls reflect sound, and echoes are caused by sound reflection."}],"images":{"book-eye":{"src":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA4QAAAEsBAMAAABpsGCiAAAAMFBMVEX////+/v79/f38/Pz4+Pju7u7f39/Ly8uysrKSkpJqamo4ODgLCwsDAwMBAQEAAAC9VGovAABmuElEQVR42u1dd2AU1dY/d3ZDEkh27swGpCU7sxuKlGR3E7CTSrNRQlefigKCvaAi+vT5LE/QJ+/5LBQV9Yn0oj4RUgELQpLdBFRKdmc2QSnJztzZUALZnfv9kUKCBFDxE0jOP5CdzeTO/O7vtHvvOQBt0iZt0iZt0iZt0iYXtaBW++CcCNRL2mbAxSsOAABDGwsv3se2eq54DFfNDxS3TeaLVOwwJ4dS+iWktb2Li1OsYXNV6vcodD3Y297GxSgGWEhDXkpVJfixoe11XJRq9F6qKFShuqrWPudsex8XIQnD8726WkWDEtWl4xe9Km2FHilKvO9OBoKrEXYNTMS+b281XdzRYSs0BdzBVT5Wz4/8vusuuFrr1Jd <script>
/*
 * Anthony Niblett's amazing light and sound quiz
 *
 * Plain JavaScript with no libraries, and nothing is loaded from the internet.
 * Written in an older style of JavaScript on purpose, so it also runs in old browsers.
 *
 * How a game works:
 *   - all the questions are shuffled into a new order every time the page loads
 *   - the first question is never one that opened a recent game
 *   - the four answers to each question are shuffled too
 *   - every right answer raises the light meter by one step
 */
(function () {
  'use strict';

  /* If something stops the quiz from working on this device, say so on the page, with the
     technical reason, so it can be passed on. Without this an old browser just shows a gap. */
  function reportProblem(detail) {
    try {
      var box = document.getElementById('problem');
      if (!box) {
        box = document.createElement('p');
        box.id = 'problem';
        box.className = 'problem';
        (document.querySelector('.page') || document.body).appendChild(box);
      }
      box.textContent = 'Something stopped the quiz from working on this device. Show this to a grown-up: ' + detail;
    } catch (err) { /* nothing more can be done */ }
  }
  window.onerror = function (message, source, line, column) {
    reportProblem(String(message) + ' (line ' + line + (column ? ', column ' + column : '') + ')');
    return false;
  };

  var DATA = window.LSQ_DATA;
  var QUESTIONS = DATA.questions;
  var IMAGES = DATA.images;
  var TOTAL = QUESTIONS.length;

  var KEY_STARTS = 'lightSoundQuiz.recentStarts';
  var KEY_SOUND = 'lightSoundQuiz.soundOn';
  var ARROW = ' → ';
  var SVG_NS = 'http://www.w3.org/2000/svg';

  var PRAISE = ['Yes!', 'Correct!', 'You got it!', 'Spot on!', 'That’s right!', 'Brilliant!'];

  var card = byId('card');
  var meter = byId('meter');
  var meterCover = byId('meterCover');
  var meterTip = byId('meterTip');
  var announce = byId('announce');
  var soundToggle = byId('soundToggle');
  var soundLabel = byId('soundLabel');

  var state = null;
  var recentStarts = [];
  var soundOn = true;
  var audio = null;
  var reducedMotion = false;
  try { reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (err) { reducedMotion = false; }

  /* ------------------------------------------------------------ helpers */

  function byId(id) { return document.getElementById(id); }

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) { node.className = className; }
    if (text !== undefined && text !== null) { node.appendChild(document.createTextNode(text)); }
    return node;
  }

  function clear(node) { while (node.firstChild) { node.removeChild(node.firstChild); } }

  function each(list, fn) { for (var i = 0; i < list.length; i++) { fn(list[i], i); } }

  function readStore(key, fallback) {
    try {
      var raw = window.localStorage.getItem(key);
      return raw === null ? fallback : JSON.parse(raw);
    } catch (err) {
      return fallback;
    }
  }

  function writeStore(key, value) {
    try { window.localStorage.setItem(key, JSON.stringify(value)); } catch (err) { /* storage blocked: carry on without it */ }
  }

  /* A whole number from 0 to n - 1, every value equally likely. */
  function randomInt(n) {
    try {
      var source = window.crypto || window.msCrypto;
      if (source && source.getRandomValues) {
        var box = new Uint32Array(1);
        var limit = Math.floor(4294967296 / n) * n;
        do { source.getRandomValues(box); } while (box[0] >= limit);
        return box[0] % n;
      }
    } catch (err) { /* fall through */ }
    return Math.floor(Math.random() * n);
  }

  function shuffle(list) {
    var copy = list.slice();
    for (var i = copy.length - 1; i > 0; i--) {
      var j = randomInt(i + 1);
      var held = copy[i];
      copy[i] = copy[j];
      copy[j] = held;
    }
    return copy;
  }

  function restartAnimation(node, className) {
    node.className = node.className.replace(new RegExp('(^|\\s)' + className + '(?=\\s|$)', 'g'), '').replace(/^\s+|\s+$/g, '');
    void node.offsetWidth;
    node.className += (node.className ? ' ' : '') + className;
  }

  /* --------------------------------------------------------- game set-up */

  function loadRecentStarts() {
    var saved = readStore(KEY_STARTS, null);
    if (!saved || typeof saved.length !== 'number') { return; }
    var known = {};
    each(QUESTIONS, function (q) { known[q.id] = true; });
    var clean = [];
    each(saved, function (id) {
      if (typeof id === 'string' && known[id] && clean.indexOf(id) === -1) { clean.push(id); }
    });
    recentStarts = clean;
  }

  function newGame() {
    var order = [];
    var i;
    for (i = 0; i < TOTAL; i++) { order.push(i); }
    order = shuffle(order);

    /* Start on a question that has not opened a recent game. Prefer one without a picture,
       so the title and the whole first question fit on a small screen together. */
    loadRecentStarts();
    var pick = -1;
    var anyNew = -1;
    for (i = 0; i < order.length; i++) {
      var candidate = QUESTIONS[order[i]];
      if (recentStarts.indexOf(candidate.id) !== -1) { continue; }
      if (anyNew === -1) { anyNew = i; }
      if (!candidate.img && typeof candidate.options[0] === 'string') { pick = i; break; }
    }
    if (pick === -1) { pick = anyNew === -1 ? 0 : anyNew; }
    var first = order.splice(pick, 1)[0];
    order.unshift(first);
    recentStarts.push(QUESTIONS[first].id);
    while (recentStarts.length > TOTAL - 1) { recentStarts.shift(); }
    writeStore(KEY_STARTS, recentStarts);

    state = { order: order, pos: 0, right: 0, wrong: 0, answered: false, missed: [], display: [] };
    updateScore(null);
    showQuestion(false);
  }

  /* ------------------------------------------------------- one question */

  function picture(key, alt) {
    var info = IMAGES[key];
    var img = document.createElement('img');
    img.setAttribute('width', info.w);
    img.setAttribute('height', info.h);
    img.alt = alt || '';
    img.src = info.src;
    return img;
  }

  function arrowIcon() {
    var svg = document.createElementNS(SVG_NS, 'svg');
    svg.setAttribute('class', 'arrow');
    svg.setAttribute('viewBox', '0 0 24 14');
    svg.setAttribute('aria-hidden', 'true');
    svg.setAttribute('focusable', 'false');
    var path = document.createElementNS(SVG_NS, 'path');
    path.setAttribute('d', 'M1.5 7h20M15 1.5 21.5 7 15 12.5');
    svg.appendChild(path);
    return svg;
  }

  /* Answer text. " -> " inside an answer is drawn as an arrow, and each step stays on one line. */
  function answerText(text, className) {
    var holder = el('span', className);
    var parts = text.split(ARROW);
    if (parts.length === 1) {
      holder.appendChild(document.createTextNode(text));
      return holder;
    }
    each(parts, function (part, i) {
      var step = el('span', 'step');
      if (i) { step.appendChild(arrowIcon()); }
      step.appendChild(document.createTextNode(part));
      holder.appendChild(step);
      if (i < parts.length - 1) { holder.appendChild(document.createTextNode(' ')); }
    });
    return holder;
  }

  function spoken(text) { return text.split(ARROW).join(', then '); }

  function makeOption(q, originalIndex) {
    var option = q.options[originalIndex];
    var button = el('button', 'option');
    button.type = 'button';
    button.setAttribute('data-index', String(originalIndex));

    /* The bubble and the answer sit side by side in a row INSIDE the button. Old versions of
       Safari (iOS 10 and earlier) cannot lay out a button's own children side by side. */
    var row = el('span', 'option-row');
    var bubble = el('span', 'bubble');
    bubble.setAttribute('aria-hidden', 'true');
    row.appendChild(bubble);

    if (typeof option === 'string') {
      row.appendChild(answerText(option, 'option-text'));
      if (option.indexOf(ARROW) !== -1) { button.setAttribute('aria-label', spoken(option)); }
    } else {
      button.className += ' option--picture';
      var holder = el('span', 'option-pic');
      holder.appendChild(picture(option.img, option.alt));
      row.appendChild(holder);
    }
    button.appendChild(row);

    button.addEventListener('click', function () { choose(originalIndex); });
    return button;
  }

  function showQuestion(moveFocus) {
    var q = QUESTIONS[state.order[state.pos]];
    state.answered = false;
    state.display = shuffle([0, 1, 2, 3]);

    clear(card);
    card.className = 'card';
    card.appendChild(el('p', 'q-count', 'Question ' + (state.pos + 1) + ' of ' + TOTAL));

    if (q.img) {
      var figure = el('figure', 'q-figure');
      figure.appendChild(picture(q.img, q.alt));
      card.appendChild(figure);
    }

    var heading = el('h2', 'q-text', q.q);
    heading.id = 'question';
    heading.setAttribute('tabindex', '-1');
    card.appendChild(heading);

    var pictures = typeof q.options[0] !== 'string';
    var group = el('div', pictures ? 'options options--pictures' : 'options');
    group.id = 'options';
    group.setAttribute('role', 'group');
    group.setAttribute('aria-labelledby', 'question');
    each(state.display, function (originalIndex) { group.appendChild(makeOption(q, originalIndex)); });
    card.appendChild(group);

    announce.textContent = '';
    if (moveFocus) { focusQuietly(heading); }

    /* Keep every answer on screen: now, and again once this question's pictures have loaded
       (a picture has no height until then, so the first check can come out too short). */
    var shownAt = state.pos;
    each(card.querySelectorAll('img'), function (img) {
      img.addEventListener('load', function () {
        if (state && state.pos === shownAt && !state.answered) { bringCardIntoView(); }
      });
    });
    bringCardIntoView();
  }

  function choose(originalIndex) {
    if (!state || state.answered || state.pos >= TOTAL) { return; }
    state.answered = true;

    var questionIndex = state.order[state.pos];
    var q = QUESTIONS[questionIndex];
    var isRight = originalIndex === q.answer;
    if (isRight) {
      state.right += 1;
    } else {
      state.wrong += 1;
      state.missed.push(questionIndex);
    }

    each(card.querySelectorAll('.option'), function (button) {
      var index = Number(button.getAttribute('data-index'));
      button.disabled = true;
      if (index === q.answer) {
        button.className += ' is-correct';
        button.appendChild(el('span', 'sr-only', ' (the right answer)'));
      } else if (index === originalIndex) {
        button.className += ' is-wrong';
        button.appendChild(el('span', 'sr-only', ' (your answer)'));
      } else {
        button.className += ' is-dim';
      }
    });

    var correct = q.options[q.answer];
    var verdictText = isRight ? PRAISE[(state.right - 1) % PRAISE.length] : 'Not this time.';
    var spokenParts = [verdictText];

    var feedback = el('div', isRight ? 'feedback is-right' : 'feedback is-wrong');
    feedback.id = 'feedback';
    feedback.appendChild(el('p', 'verdict', verdictText));
    if (!isRight) {
      var line = el('p', 'answer-line');
      if (typeof correct === 'string') {
        line.appendChild(document.createTextNode('The answer is: '));
        var strong = el('b');
        strong.appendChild(answerText(correct, ''));
        line.appendChild(strong);
        spokenParts.push('The answer is: ' + spoken(correct) + '.');
      } else {
        line.appendChild(document.createTextNode('The right wave is the one shown in green.'));
        spokenParts.push('The right wave is: ' + correct.alt + '.');
      }
      feedback.appendChild(line);
    }
    feedback.appendChild(el('p', 'why', q.why));
    spokenParts.push(q.why);
    card.appendChild(feedback);

    var last = state.pos === TOTAL - 1;
    var actions = el('div', 'actions');
    var nextButton = el('button', 'next', last ? 'See your score' : 'Next question');
    nextButton.type = 'button';
    nextButton.id = 'next';
    nextButton.addEventListener('click', next);
    actions.appendChild(nextButton);
    card.appendChild(actions);

    updateScore(isRight);
    announce.textContent = spokenParts.join(' ');
    if (isRight) { playRight(state.right); } else { playWrong(); }
    focusQuietly(nextButton);
    reveal(nextButton, 18);
  }

  function next() {
    if (!state.answered) { return; }
    state.pos += 1;
    if (state.pos >= TOTAL) { showFinal(); } else { showQuestion(true); }
  }

  /* ----------------------------------------------------- score and meter */

  function setCount(name, value, bump) {
    each(document.querySelectorAll('[data-count="' + name + '"]'), function (node) {
      node.textContent = String(value);
      if (bump && !reducedMotion) { restartAnimation(node, 'bump'); }
    });
  }

  /* gotOneRight: true after a right answer, false after a wrong one, null when nothing was just answered. */
  function updateScore(gotOneRight) {
    var done = state.right + state.wrong;
    var level = state.right * 100 / TOTAL;
    setCount('right', state.right, gotOneRight === true);
    setCount('wrong', state.wrong, gotOneRight === false);
    setCount('togo', TOTAL - done, false);
    meter.setAttribute('aria-label', state.right + ' right out of ' + TOTAL);
    meterCover.style.height = (100 - level) + '%';
    meterTip.style.bottom = level + '%';
    if (gotOneRight === true && !reducedMotion) { restartAnimation(meter, 'is-bump'); }
  }

  function buildMeter() {
    var ticks = byId('meterTicks');
    var scale = byId('meterScale');
    var i;
    for (i = 1; i < 100; i++) {
      var tick = el('div', 'tick' + (i % 10 === 0 ? ' tick--10' : (i % 5 === 0 ? ' tick--5' : '')));
      tick.style.bottom = i + '%';
      ticks.appendChild(tick);
    }
    for (i = 10; i <= 100; i += 10) {
      var label = el('li', '', String(Math.round(i * TOTAL / 100)));
      label.style.bottom = i + '%';
      scale.appendChild(label);
    }
  }

  /* When the page opens, the whole rainbow rises through the meter and drains away again. */
  function lampTest() {
    if (reducedMotion) { return; }
    var finished = false;
    function finish() {
      if (finished) { return; }
      finished = true;
      meter.className = meter.className.replace(/(^|\s)is-testing(?=\s|$)/g, '').replace(/^\s+|\s+$/g, '');
    }
    meter.className += ' is-testing';
    meterCover.addEventListener('animationend', finish);
    meterCover.addEventListener('webkitAnimationEnd', finish);
    window.setTimeout(finish, 2600);
  }

  /* ---------------------------------------------------------- final page */

  function finalMessage(right) {
    var percent = right * 100 / TOTAL;
    if (percent >= 100) { return 'A perfect score! You filled the whole meter with light.'; }
    if (percent >= 90) { return 'Amazing! You really know your light and sound.'; }
    if (percent >= 75) { return 'Great work! Only a few left to learn.'; }
    if (percent >= 50) { return 'Good going! Play again and see how much higher you can fill the meter.'; }
    return 'Good try! Every game you play fills the meter a little higher.';
  }

  function showFinal() {
    clear(card);
    card.className = 'card card--final';
    card.appendChild(el('p', 'q-count', 'All ' + TOTAL + ' questions done'));

    var title = el('h2', 'final-title', 'You got ' + state.right + ' out of ' + TOTAL + '!');
    title.id = 'question';
    title.setAttribute('tabindex', '-1');
    card.appendChild(title);
    card.appendChild(el('p', 'final-msg', finalMessage(state.right)));

    var actions = el('div', 'actions');
    var again = el('button', 'next', 'Play again');
    again.type = 'button';
    again.id = 'again';
    again.addEventListener('click', function () {
      newGame();
      bringCardIntoView();
      focusQuietly(byId('question'));
    });
    actions.appendChild(again);
    card.appendChild(actions);

    if (state.missed.length) {
      var details = el('details', 'missed');
      var count = state.missed.length;
      details.appendChild(el('summary', '', 'Look again at the ' + (count === 1 ? 'one' : count) + ' you missed'));
      var list = el('ol');
      each(state.missed, function (questionIndex) {
        var q = QUESTIONS[questionIndex];
        var correct = q.options[q.answer];
        var item = el('li');
        item.appendChild(el('p', 'm-q', q.q));
        if (q.img) { item.appendChild(picture(q.img, q.alt)); }
        var answer = el('p', 'm-a');
        answer.appendChild(document.createTextNode('Answer: '));
        if (typeof correct === 'string') {
          answer.appendChild(answerText(correct, ''));
        } else {
          answer.appendChild(picture(correct.img, correct.alt));
        }
        item.appendChild(answer);
        item.appendChild(el('p', 'm-why', q.why));
        list.appendChild(item);
      });
      details.appendChild(list);
      card.appendChild(details);
    }

    announce.textContent = 'You got ' + state.right + ' out of ' + TOTAL + '. ' + finalMessage(state.right);
    playFanfare();
    bringCardIntoView();
    focusQuietly(title);
  }

  /* --------------------------------------------------- scrolling, focus */

  /* Keep the whole question card on screen, moving the page as little as possible.
     (Short screens, such as a tablet held sideways, cannot show the title and a long question at once.) */
  function bringCardIntoView() {
    var rect = card.getBoundingClientRect();
    var viewport = window.innerHeight || document.documentElement.clientHeight;
    var current = window.pageYOffset || document.documentElement.scrollTop || 0;
    var room = 12;
    if (rect.top < 0 || rect.height + 2 * room > viewport) {
      /* The top is cut off, or the card is taller than the screen: start from the top of the card. */
      window.scrollTo(0, Math.max(0, Math.floor(current + rect.top - room)));
    } else if (rect.bottom > viewport - room) {
      /* Only the bottom is cut off: move up just far enough to show it. */
      window.scrollTo(0, Math.ceil(current + rect.bottom - viewport + room));
    }
  }

  /* Scroll just far enough to show `node` with a little room around it. */
  function reveal(node, room) {
    var rect = node.getBoundingClientRect();
    var viewport = window.innerHeight || document.documentElement.clientHeight;
    var current = window.pageYOffset || document.documentElement.scrollTop || 0;
    if (rect.bottom > viewport - room) {
      window.scrollTo(0, Math.ceil(current + rect.bottom - viewport + room));
    } else if (rect.top < room) {
      window.scrollTo(0, Math.max(0, Math.floor(current + rect.top - room)));
    }
  }

  function focusQuietly(node) {
    if (!node) { return; }
    try { node.focus({ preventScroll: true }); } catch (err) { node.focus(); }
  }

  /* --------------------------------------------------------------- sound */

  function audioContext() {
    if (!soundOn) { return null; }
    try {
      if (!audio) {
        var Maker = window.AudioContext || window.webkitAudioContext;
        if (!Maker) { return null; }
        audio = new Maker();
      }
      if (audio.state === 'suspended' && audio.resume) { audio.resume(); }
      return audio;
    } catch (err) {
      return null;
    }
  }

  function tone(ctx, from, to, delay, length, peak, shape) {
    try {
      var start = ctx.currentTime + delay;
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = shape;
      osc.frequency.setValueAtTime(from, start);
      if (to !== from) { osc.frequency.linearRampToValueAtTime(to, start + length); }
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.linearRampToValueAtTime(peak, start + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + length);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(start);
      osc.stop(start + length + 0.03);
    } catch (err) { /* no sound is fine */ }
  }

  /* The right-answer chime climbs in pitch as the meter fills: more vibrations per second, higher pitch. */
  function playRight(rightSoFar) {
    var ctx = audioContext();
    if (!ctx) { return; }
    var base = 330 * Math.pow(2, 2 * (rightSoFar - 1) / Math.max(1, TOTAL - 1));
    tone(ctx, base, base, 0, 0.16, 0.11, 'triangle');
    tone(ctx, base * 1.5, base * 1.5, 0.11, 0.3, 0.11, 'triangle');
  }

  function playWrong() {
    var ctx = audioContext();
    if (!ctx) { return; }
    tone(ctx, 196, 150, 0, 0.3, 0.1, 'sine');
  }

  function playFanfare() {
    var ctx = audioContext();
    if (!ctx) { return; }
    each([523.25, 659.25, 783.99, 1046.5], function (frequency, i) {
      tone(ctx, frequency, frequency, i * 0.13, i === 3 ? 0.6 : 0.2, 0.1, 'triangle');
    });
  }

  function showSoundSetting() {
    soundToggle.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
    soundToggle.className = soundOn ? 'sound-toggle' : 'sound-toggle is-off';
    soundLabel.textContent = soundOn ? 'Sound on' : 'Sound off';
  }

  /* ---------------------------------------------------------------- start */

  soundOn = readStore(KEY_SOUND, true) !== false;
  showSoundSetting();
  soundToggle.addEventListener('click', function () {
    soundOn = !soundOn;
    writeStore(KEY_SOUND, soundOn);
    showSoundSetting();
    if (soundOn) { playRight(1); }
  });

  /* Number keys 1 to 4 pick an answer. */
  document.addEventListener('keydown', function (event) {
    if (event.altKey || event.ctrlKey || event.metaKey || !state || state.answered) { return; }
    var key = event.key;
    if (key !== '1' && key !== '2' && key !== '3' && key !== '4') { return; }
    var buttons = card.querySelectorAll('.option');
    var button = buttons[Number(key) - 1];
    if (button && !button.disabled) { button.click(); }
  });

  /* Closing or reloading the tab part-way through a long game asks first. */
  window.addEventListener('beforeunload', function (event) {
    if (!state) { return undefined; }
    var done = state.right + state.wrong;
    if (done >= 5 && done < TOTAL) {
      event.preventDefault();
      event.returnValue = '';
      return '';
    }
    return undefined;
  });

  buildMeter();
  newGame();
  lampTest();
})();
</script>
